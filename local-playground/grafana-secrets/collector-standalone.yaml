# Standalone collector config to exercise the grafanasecretsmanager provider
# WITHOUT a supervisor. The secret is resolved at startup and injected as a
# resource attribute so you can see it in the debug exporter output.
#
# Run the stub first (serves the secret over loopback), then:
#   GRAFANA_SECRETS_MANAGER_ENDPOINT=http://127.0.0.1:8999 \
#   GRAFANA_SECRETS_MANAGER_TOKEN=playtoken \
#   ./bin/otelcontribcol_darwin_arm64 --config local-playground/grafana-secrets/collector-standalone.yaml

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  resource:
    attributes:
      - key: demo.secret
        value: ${grafanasecretsmanager:demo}
        action: insert

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource]
      exporters: [debug]
