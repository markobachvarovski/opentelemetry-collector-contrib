# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: cmd/opampsupervisor

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Add an opt-in secrets broker that receives secrets pushed by the OpAMP server over the existing TLS connection and serves them to the managed collector over a loopback endpoint, for use with the grafanasecretsmanager confmap provider.

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
# TODO: replace with the real tracking issue (or PR) number before opening the PR.
issues:
  - 0

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  Enabled via the new `secrets::enabled` config option, which requires a TLS (`https`/`wss`) server
  endpoint. The supervisor advertises a custom capability, caches pushed secrets in memory (never on
  disk), and injects GRAFANA_SECRETS_MANAGER_ENDPOINT and GRAFANA_SECRETS_MANAGER_TOKEN into the
  collector environment.

change_logs: [user]
